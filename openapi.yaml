openapi: 3.0.3
info:
  title: API Distribuidora
  version: '1.0.0'
  description: |
    API para gestionar clientes (garrafones) y usuarios. Endpoints para listar, crear,
    actualizar y eliminar clientes; documentación de endpoints de usuarios (registro/login/get).
servers:
  - url: http://localhost:3000
    description: Servidor local
  - url: https://{host}
    description: Producción (ej. Render)
    variables:
      host:
        default: example.onrender.com
paths:
  /api/clientes:
    get:
      tags: [Clientes]
      summary: Listar clientes
      description: Devuelve la lista completa de clientes registrados.
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
              examples:
                sample:
                  value:
                    - id: "c56a4180-65aa-42ec-a945-5fd21dec0538"
                      name: "Juan Pérez"
                      email: "juan@ejemplo.com"
                      phone: "12345678"
                      productType: "Garrafón"
                      expectedQuantity: 5
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Clientes]
      summary: Crear cliente
      description: Crea un nuevo cliente. Campos `name`, `email` y `phone` son obligatorios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteInput'
            examples:
              nuevoCliente:
                value:
                  name: "María López"
                  email: "maria@ejemplo.com"
                  phone: "87654321"
                  productType: "Garrafón"
                  expectedQuantity: 3
      responses:
        '201':
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/clientes/{id}:
    parameters:
      - name: id
        in: path
        description: Identificador UUID público del cliente
        required: true
        schema:
          type: string
    put:
      tags: [Clientes]
      summary: Actualizar cliente
      description: Actualiza un cliente por su `id`. Envía únicamente los campos a modificar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteInput'
      responses:
        '200':
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Clientes]
      summary: Eliminar cliente
      description: Elimina un cliente por su `id`.
      responses:
        '200':
          description: Cliente eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users:
    post:
      tags: [Usuarios]
      summary: Registrar nuevo usuario
      description: Crea un usuario. La implementación actual solo define la doc; si se implementa, la contraseña debe ser hasheada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
            examples:
              nuevoUsuario:
                value:
                  name: "Admin"
                  email: "admin@ejemplo.com"
                  password: "secret123"
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/users/login:
    post:
      tags: [Usuarios]
      summary: Login de usuario
      description: Autentica usuario y devuelve token (documentado; implementación opcional).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            examples:
              login:
                value:
                  email: "admin@ejemplo.com"
                  password: "secret123"
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/{id}:
    parameters:
      - name: id
        in: path
        description: Identificador público del usuario
        required: true
        schema:
          type: string
    get:
      tags: [Usuarios]
      summary: Obtener usuario por id
      description: Devuelve información pública del usuario (no incluye password).
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  responses:
    BadRequest:
      description: Petición inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No autenticado / credenciales inválidas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: "Descripción del error"

    Cliente:
      type: object
      properties:
        id:
          type: string
          description: UUID público
          example: "c56a4180-65aa-42ec-a945-5fd21dec0538"
        name:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan@ejemplo.com"
        phone:
          type: string
          example: "12345678"
        company:
          type: string
          example: "Tienda Central"
        address:
          type: string
          example: "Calle Falsa 123"
        notes:
          type: string
          example: "Entrega por la mañana"
        productType:
          type: string
          example: "Garrafón"
        expectedQuantity:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - phone

    ClienteInput:
      type: object
      properties:
        name:
          type: string
          example: "María López"
        email:
          type: string
          format: email
          example: "maria@ejemplo.com"
        phone:
          type: string
          example: "87654321"
        company:
          type: string
          example: "Sucursal Norte"
        address:
          type: string
          example: "Av. Siempre Viva 742"
        notes:
          type: string
          example: "Prefiere horario de tarde"
        productType:
          type: string
          example: "Garrafón"
        expectedQuantity:
          type: integer
          example: 3
      required:
        - name
        - email
        - phone

    User:
      type: object
      properties:
        id:
          type: string
          example: "u_123456"
        name:
          type: string
          example: "Admin"
        email:
          type: string
          format: email
          example: "admin@ejemplo.com"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email

    UserInput:
      type: object
      properties:
        name:
          type: string
          example: "Admin"
        email:
          type: string
          format: email
          example: "admin@ejemplo.com"
        password:
          type: string
          format: password
      required:
        - name
        - email
        - password

    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "admin@ejemplo.com"
        password:
          type: string
          format: password
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT u otro token de sesión
        user:
          $ref: '#/components/schemas/User'
